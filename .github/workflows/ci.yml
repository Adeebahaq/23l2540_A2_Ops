name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements-app.txt ]; then pip install -r requirements-app.txt; fi

      - name: Lint (errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.git,__pycache__

      - name: Test
        run: pytest -q tests

      - name: Docker build
        run: |
          if [ -f Dockerfile ]; then
            docker build -t visionguard:ci .
          else
            echo "No Dockerfile found, skipping"
          fi