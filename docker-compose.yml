services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no "ports:" on purpose: the database is reachable only on the internal network

  web:
    build: .
    image: visionguard-web:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy            # web starts only after Postgres accepts connections
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/champion.keras
      MODEL_INFO_PATH: /app/models/champion.json
      MAX_UPLOAD_MB: "5"
    volumes:
      - ./models:/app/models:ro               # model mounted read-only, not built in
    ports:
      - "${WEB_PORT:-5000}:5000"

volumes:
  pgdata: